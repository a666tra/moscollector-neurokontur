# Compose specification (version attribute is obsolete and removed)
# Using a named volume seeded from the image ensures UID 1000 (app user)
# has full write permissions without requiring host-level chown 1000:1000 on Linux.
services:
  neurokontur:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moscollector-neurokontur
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - neurokontur-data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LCT_DEMO_DISPATCHER_PIN=135790
      - LCT_DEMO_DISPATCHER_BADGE=ДИСП-0001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neurokontur-data:
