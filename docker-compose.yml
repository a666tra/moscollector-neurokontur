version: '3.8'

services:
  neurokontur:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moscollector-neurokontur
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LCT_DEMO_DISPATCHER_PIN=135790
      - LCT_DEMO_DISPATCHER_BADGE=ДИСП-0001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
